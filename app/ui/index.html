<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>文件批量重命名</title>
<link rel="stylesheet" href="style.css" />
<script>try { var t = localStorage.getItem('fr-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { }</script>
</head>
<body>
<svg style="display:none" aria-hidden="true" focusable="false">
  <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3v5h5"/><path d="M15 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5 19 12 7 19.5z"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 8h9a5 5 0 0 1 0 10H9"/><path d="M4 8l4-4M4 8l4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-min" viewBox="0 0 24 24"><path d="M6 12h12"/></symbol>
  <symbol id="i-max" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></symbol>
  <symbol id="i-grip" viewBox="0 0 24 24"><circle cx="9" cy="7" r="1.4"/><circle cx="15" cy="7" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="17" r="1.4"/><circle cx="15" cy="17" r="1.4"/></symbol>
  <symbol id="i-chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4 4 10-11"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17h.01"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M7 4v16M4 17l3 3 3-3"/><path d="M14 7h6M14 12h6M14 17h6"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20.5 14.6A8.6 8.6 0 1 1 9.4 3.5a6.9 6.9 0 0 0 11.1 11.1z"/></symbol>
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.2 2.4c-.6.3-.9.8-.9 1.4v.5M12 17h.01"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9.5 4v16"/></symbol>
  <symbol id="i-paste" viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M15 5.5h2A2 2 0 0 1 19 7.5V19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V7.5a2 2 0 0 1 2-2h2"/></symbol>
  <symbol id="i-enter" viewBox="0 0 24 24"><path d="M4 12h13M12 7l5 5-5 5"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
  <symbol id="i-chevd" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></symbol>
  <symbol id="i-sheet" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M4 15h16M10 4v16"/></symbol>
</svg>

<div id="app">
  <header class="titlebar pywebview-drag-region">
    <div class="brand">
      <div class="logo" aria-hidden="true">FR</div>
      <div class="brand-text">
        <h1>文件批量重命名</h1>
        <p id="subtitle">把文件拖进来，或点「选择文件」</p>
      </div>
    </div>
    <div class="title-tools">
      <button type="button" class="win-btn" id="btnSettings" title="设置（全局快捷键等）" aria-label="设置"><svg><use href="#i-menu"/></svg></button>
      <button type="button" class="win-btn" id="btnHelp" title="使用说明（F1）" aria-label="使用说明"><svg><use href="#i-help"/></svg></button>
      <button type="button" class="win-btn" id="btnTheme" title="深色 / 浅色（Ctrl+T）" aria-label="切换主题"><svg><use href="#i-moon"/></svg></button>
    </div>
    <div class="win-actions">
      <button type="button" class="win-btn" data-win="min" title="最小化" aria-label="最小化"><svg><use href="#i-min"/></svg></button>
      <button type="button" class="win-btn" data-win="max" title="最大化" aria-label="最大化"><svg><use href="#i-max"/></svg></button>
      <button type="button" class="win-btn danger" data-win="close" title="关闭" aria-label="关闭"><svg><use href="#i-close"/></svg></button>
    </div>
  </header>

  <div class="toolbar">
    <div class="tb-group">
      <button type="button" class="btn primary" id="btnPickFiles" aria-keyshortcuts="Control+O">
        <svg><use href="#i-file"/></svg><span>选择文件</span>
      </button>
      <button type="button" class="btn" id="btnPickFolder" aria-keyshortcuts="Control+Shift+O">
        <svg><use href="#i-folder"/></svg><span>选择文件夹</span>
      </button>
      <button type="button" class="btn" id="btnPaste" title="导入资源管理器里复制的文件 / 文件夹（Ctrl+V）">
        <svg><use href="#i-paste"/></svg><span>粘贴导入</span>
      </button>
      <button type="button" class="btn clear-menu" id="btnClear" disabled title="清空文件列表或已添加的规则">
        <svg><use href="#i-trash"/></svg><span>清空</span><svg><use href="#i-chevd"/></svg>
      </button>
    </div>
    <div class="tb-group right">
      <div class="pills" id="pills" aria-live="polite"></div>
      <button type="button" class="btn" id="btnCopy" disabled title="复制选中项的路径或名称（Ctrl+Shift+C）">
        <svg><use href="#i-copy"/></svg><span>复制</span>
      </button>
      <button type="button" class="btn warn" id="btnRevert" disabled title="撤回已完成的改名（Ctrl+Z）">
        <svg><use href="#i-undo"/></svg><span>撤回</span>
      </button>
      <button type="button" class="btn danger" id="btnRemove" disabled title="从列表移除，不动磁盘文件（Delete）">
        <svg><use href="#i-trash"/></svg><span>移除</span>
      </button>
      <button type="button" class="btn run" id="btnRun" disabled aria-keyshortcuts="Control+Enter">
        <svg><use href="#i-play"/></svg><span>开始重命名</span>
      </button>
    </div>
  </div>

  <main class="body">
    <section class="modes">
      <div class="modebar" id="modebar"></div>
      <div class="mode-panel" id="modePanel"></div>
    </section>

    <section class="preview" id="preview">
      <div class="preview-head">
        <div class="nav-left">
          <button type="button" class="btn tiny icon-only" id="btnUp" title="返回上一级（Alt+↑）" aria-label="返回上一级" hidden>
            <svg><use href="#i-up"/></svg>
          </button>
          <nav class="crumbs" id="crumbs" aria-label="目录层级"></nav>
        </div>
        <div class="preview-tools">
          <label class="sort-box">
            <svg><use href="#i-sort"/></svg>
            <button type="button" class="fake-select sort-select" id="sortBtn" aria-label="排序方式">
              <span id="sortLabel">默认顺序</span>
              <svg><use href="#i-chevd"/></svg>
            </button>
          </label>
          <button type="button" class="btn tiny" id="btnSelectAll" title="全选（Ctrl+A）">全选</button>
          <button type="button" class="btn tiny" id="btnInvert" title="反选（Ctrl+I）">反选</button>
        </div>
      </div>

      <div class="table" id="table" hidden>
        <div class="thead">
          <span class="c-sel"></span>
          <span class="c-name">原始名称</span>
          <span class="c-dir">所在目录</span>
          <span class="c-new">新名称预览</span>
          <span class="c-type">类型</span>
          <span class="c-size">大小</span>
          <span class="c-time">修改时间</span>
          <span class="c-status">状态</span>
          <span class="c-act">操作</span>
        </div>
        <div class="tbody" id="rows"></div>
      </div>

      <div class="empty" id="empty">
        <div class="empty-art"><svg><use href="#i-file"/></svg></div>
        <h3>还没有导入文件</h3>
        <p>把文件或文件夹拖到这个窗口里，或点左上角「选择文件」</p>
        <div class="empty-tip">也可以按 Ctrl+V 直接粘贴资源管理器里复制的文件</div>
      </div>

      <div class="drop-mask" id="dropMask">
        <div class="drop-inner"><svg><use href="#i-plus"/></svg><span>松开即可导入</span></div>
      </div>
    </section>
  </main>

  <footer class="statusbar">
    <span id="statusLeft">就绪</span>
    <div class="progress" id="progress" hidden><i></i></div>
    <span id="statusRight"></span>
  </footer>
</div>

<div id="resizers">
  <i data-ht="13" class="nw"></i><i data-ht="12" class="n"></i><i data-ht="14" class="ne"></i>
  <i data-ht="10" class="w"></i><i data-ht="11" class="e"></i>
  <i data-ht="16" class="sw"></i><i data-ht="15" class="s"></i><i data-ht="17" class="se"></i>
</div>

<div id="toasts" role="status" aria-live="polite"></div>

<div class="popmask" id="popmask" hidden></div>
<div class="menu" id="menu" hidden></div>
<div class="dialog" id="dialog" hidden></div>

<script src="app.js"></script>
</body>
</html>
